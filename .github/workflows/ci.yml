name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        # https://docs.github.com/actions/tutorials/build-and-test-code/python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        env:
          API_TOKEN: ci-dummy
          REDIS_URL: fake://
        run: >-
          python -m pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: https://chat-service-production-aaff.up.railway.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy tested revision
        # https://docs.railway.com/cli/deploying#cicd-integration
        run: npx --yes @railway/cli@5.35.1 up --service chat-service --ci

      - name: Smoke test deployment
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$PUBLIC_URL/healthz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become healthy in time" >&2
          exit 1
